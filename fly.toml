primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = 15

[build]
  dockerfile = "Dockerfile"

[env]
  RAIL = "mock"
  DB_PATH = "/data/osc.sqlite"
  PORT = "3000"
  SYSTEM_BANNER = "internal playtest — no real USDC"

[[mounts]]
  source = "osc_data"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
